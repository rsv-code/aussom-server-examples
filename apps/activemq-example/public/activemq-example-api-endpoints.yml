opencollection: 1.0.0
info:
  name: activemq-example-api-endpoints
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ''
      port: ''
      auth:
        username: ''
        password: ''
      bypassProxy: ''
items:
  - info:
      name: /
      type: http
      seq: 1
    http:
      method: GET
      url: '{{host}}/'
      auth: inherit
    settings:
      encodeUrl: true
      timeout: 0
      followRedirects: true
      maxRedirects: 5
  - info:
      name: /status
      type: http
      seq: 2
    http:
      method: GET
      url: '{{host}}/status'
      auth: inherit
    settings:
      encodeUrl: true
      timeout: 0
      followRedirects: true
      maxRedirects: 5
  - info:
      name: /publish
      type: http
      seq: 3
    http:
      method: GET
      url: '{{host}}/publish'
      auth: inherit
    settings:
      encodeUrl: true
      timeout: 0
      followRedirects: true
      maxRedirects: 5
request:
  variables:
    - name: host
      value: http://localhost:8081/activemqexample
bundled: true
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
    exportedAt: '2026-06-06T20:52:46.992Z'
    exportedUsing: Bruno
